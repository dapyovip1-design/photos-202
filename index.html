<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instagram Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141414;--line:#262626;--ac:#8D36FF;--tx:#fff;--mut:#a8a8a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ac);color:#000}
header h1{flex:1;margin:0;font-size:18px;text-align:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{width:40px;height:40px;font-size:22px;border-radius:50%}
.ib:focus-visible,.card:focus-visible,.nav a:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{max-width:900px;margin:auto}
.gal{padding:12px}
.hero{position:relative;height:52vw;max-height:340px;background:#111 center 28%/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px;background-image:linear-gradient(135deg,#8D36FF,#1b0a3d)}
.hero h2{margin:0;font-size:32px;font-weight:400}.hero p{margin:0;color:#ddd;font-size:19px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 12px 24px}
.tile{position:relative;aspect-ratio:1/0.76;border-radius:22px;overflow:hidden;padding:0;background:linear-gradient(#1c1c1c,#050505);text-align:start}
.tile img{object-position:center 30%;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 45%,#000c)}
.tile span{position:absolute;inset-inline:12px;bottom:10px;z-index:1;font-weight:700;font-size:17px;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid button{padding:0;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--card)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.scrim{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.2s;z-index:8}
.nav{position:fixed;top:0;bottom:0;inset-inline-start:0;width:270px;max-width:80%;background:#0b0b0b;border-inline-end:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:9;padding:20px 0}
[dir=ltr] .nav{transform:translateX(-100%)}
body.open .nav{transform:none}body.open .scrim{opacity:1;pointer-events:auto}
.nav h3{margin:0 18px 14px;font-size:18px}
.nav a{display:block;padding:13px 18px;color:var(--tx);text-decoration:none;border-inline-start:4px solid transparent}
.nav a.on{background:#1b1030;border-color:var(--ac)}
.nav a.ig{display:flex;align-items:center;gap:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:16px;font-weight:700}
.nav a.ig svg{flex:none;color:var(--ac)}
#lb .cnt{direction:ltr}
[dir=ltr] #lb .p{right:auto;left:8px}[dir=ltr] #lb .n{left:auto;right:8px}
#lg{position:fixed;inset:0;background:#000b;z-index:25;display:none;align-items:center;justify-content:center;padding:16px}
#lg.show{display:flex}
#lg .box{width:100%;max-width:440px;max-height:82vh;display:flex;flex-direction:column;background:#111;border:1px solid var(--line);border-radius:22px;overflow:hidden}
#lg .lh{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-size:18px}
#lg .lgrid{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
#lg .lgrid button{padding:12px 8px;border-radius:12px;background:var(--card);border:2px solid transparent;font-weight:700}
#lg .lgrid button.on{border-color:var(--ac);background:#1b1030}
#lg .lgrid button:focus-visible{outline:2px solid #fff}
#lb{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#lb.show{display:flex}
#lb .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;touch-action:pan-y}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .pn{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;background:#0008;font-size:22px}
#lb .p{right:8px}#lb .n{left:8px}
#lb .dlb{margin:10px auto 0;padding:12px 30px;background:var(--ac);color:#000;border-radius:999px;font-weight:700;font-size:17px}
#toast{position:fixed;left:50%;bottom:90px;translate:-50% 0;background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;max-width:90%;text-align:center;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
#lb .cnt{text-align:center;color:var(--mut);padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}

.grid button{position:relative}
.addt{aspect-ratio:3/4;border-radius:12px;border:2px dashed #8D36FF99;background:#8D36FF14;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px!important;text-align:center}
.addt svg{color:var(--ac)}.addt b{font-size:15px}.addt small{color:var(--mut);font-size:12px;line-height:1.3}
.mb{position:absolute;top:6px;inset-inline-start:6px;background:var(--ac);color:#000;font-style:normal;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
#lb .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 12px 0}
#lb .acts .dlb{margin:0;padding:12px 24px}
#lb .dng{background:#3a0f12;color:#ff9c9c;border:1px solid #7a2a2f}
#ee{position:fixed;inset:0;background:#0b0b0b;z-index:40;display:none;flex-direction:column}
#ee.show{display:flex}
#ee .eb,#ee .ep,#ee .etabs{position:relative;z-index:3;background:#0b0b0b}
#ee .eb{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#ee .eb b{font-size:17px}
#ee .esave{background:var(--ac);color:#000;font-weight:700;padding:9px 24px;border-radius:999px}
#ee .est{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;z-index:1}
#ee .ew{position:relative;touch-action:none;direction:ltr}
#ee canvas{display:block;touch-action:none}
#cb{position:absolute;display:none;border:2px solid #fff;box-shadow:0 0 0 9999px #0009;touch-action:none;cursor:move;
  background-image:linear-gradient(#fff4 1px,transparent 1px),linear-gradient(90deg,#fff4 1px,transparent 1px);background-size:100% 33.333%,33.333% 100%}
#cb .h{position:absolute;width:44px;height:44px;touch-action:none}
#cb .h:after{content:"";position:absolute;width:20px;height:20px;border:4px solid #fff}
#cb .tl{left:-22px;top:-22px}#cb .tl:after{left:15px;top:15px;border-right:0;border-bottom:0}
#cb .tr{right:-22px;top:-22px}#cb .tr:after{right:15px;top:15px;border-left:0;border-bottom:0}
#cb .bl{left:-22px;bottom:-22px}#cb .bl:after{left:15px;bottom:15px;border-right:0;border-top:0}
#cb .br{right:-22px;bottom:-22px}#cb .br:after{right:15px;bottom:15px;border-left:0;border-top:0}
#ee .ep{padding:8px 14px;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:8px}
#ee .row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:4px 2px}
#ee .pill{padding:9px 20px;border-radius:999px;background:var(--ac);color:#000;font-weight:700;white-space:nowrap;flex:none}
#ee .pill.o,#ee .rb{background:#1c1c1c;color:#fff;border:1px solid #3a3a3a}
#ee .rb{padding:8px 16px;border-radius:999px;white-space:nowrap;flex:none}
#ee .rb.on{border-color:var(--ac);background:#1b1030}
#ee .sq{width:46px;height:46px;border-radius:50%;background:#1c1c1c;border:1px solid #3a3a3a;font-size:22px;flex:none}
#ee .fb{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;font-size:12px;color:#ccc;padding:4px;border-radius:12px;border:2px solid transparent}
#ee .fb canvas{width:64px;height:64px;border-radius:10px}
#ee .fb.on{border-color:var(--ac);color:#fff}
#ee .sl{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:8px;font-size:14px}
#ee input[type=range]{accent-color:var(--ac);width:100%}
#ee .sl output{text-align:end;color:var(--mut);font-size:13px}
#ti{flex:1;min-width:0;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#fff;padding:9px 12px;font:inherit}
#ee .sw{width:30px;height:30px;border-radius:50%;border:2px solid #555;flex:none}
#ee .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
#ee .hint{color:var(--mut);font-size:12px}
#ee .etabs{display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#ee .etabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:12px;color:#bbb;min-width:58px}
#ee .etabs button span{font-size:22px;line-height:1.1}#ee .etabs small{font-size:12px}
#ee .etabs button.on{background:#1b1030;color:#fff}
#dlg{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
#dlg.show{display:flex}
#dlg .box{width:100%;max-width:360px;background:#151515;border:1px solid var(--line);border-radius:20px;padding:18px}
#dlg p{margin:0 0 14px;font-size:17px;text-align:center}
#dlgb{display:flex;flex-direction:column;gap:8px}
#dlgb .dbtn{padding:13px;border-radius:14px;font-weight:700;background:var(--ac);color:#000}
#dlgb .dbtn.o{background:#222;color:#fff}#dlgb .dbtn.dng{background:#3a0f12;color:#ff9c9c}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header>
  <button class="ib" id="menu" aria-label="القائمة"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <h1 id="title"></h1>
  <button class="ib" id="lgb" aria-label="اللغة"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3 3.2 15 0 18M12 3c-3.2 3-3.2 15 0 18"/></svg></button>
  <button class="ib" id="home" aria-label="الرئيسية"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 3l8 7.5V21H4z"/></svg></button>
</header>
<div class="scrim" id="scrim"></div>
<div id="lg" role="dialog" aria-modal="true"><div class="box"><div class="lh"><b id="lgt"></b><button class="ib" id="lgx">✕</button></div><div class="lgrid" id="lgrid"></div></div></div>
<nav class="nav" id="nav" aria-label="الصفحات"><h3>Instagram Photos</h3></nav>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lb" role="dialog" aria-modal="true">
  <div class="bar">
    <button class="ib" id="x" aria-label="إغلاق">✕</button>
    <span></span>
  </div>
  <div class="stage">
    <button class="pn p" id="prev" aria-label="السابق">›</button>
    <img id="big" alt="">
    <button class="pn n" id="next" aria-label="التالي">‹</button>
  </div>
  <div class="acts"><button id="ed" class="dlb"></button><button id="dl" class="dlb">⬇ تحميل الصورة</button><button id="del" class="dlb dng"></button></div>
  <div class="cnt" id="cnt"></div>
</div>

<input type="file" id="fi" accept="image/*" multiple hidden>
<div id="ee" role="dialog" aria-modal="true">
  <div class="eb"><button class="ib" id="ex" aria-label="✕">✕</button><b id="et"></b><button id="es" class="esave"></button></div>
  <div class="est" id="est"><div class="ew" id="ew"><canvas id="ec"></canvas><div id="cb"><i class="h tl" data-k="tl"></i><i class="h tr" data-k="tr"></i><i class="h bl" data-k="bl"></i><i class="h br" data-k="br"></i></div></div></div>
  <div class="ep" id="ep"></div>
  <div class="etabs" id="etabs"></div>
</div>
<div id="dlg" role="dialog" aria-modal="true"><div class="box"><p id="dlgm"></p><div id="dlgb"></div></div></div>

})}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();if(!/^(data|blob):/i.test(src))im.crossOrigin="anonymous";im.onload=()=>res(im);im.onerror=()=>rej(new Error("img"));im.src=src})}
const blobToUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error||new Error("read"));r.readAsDataURL(b)});
function dlBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}

/* ---- التخزين: IndexedDB وبديل في الذاكرة ---- */
let mine=[],mineReady=false,dbp=null,memOnly=false,memWarned=false;
function db(){ if(dbp)return dbp;
  dbp=new Promise((res,rej)=>{try{const r=indexedDB.open("photos2027",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("mine",{keyPath:"id"});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))}catch(e){rej(e)}});
  return dbp}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("mine",mode),r=fn(t.objectStore("mine"));
  t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function loadMine(){
  try{const all=await tx("readonly",s=>s.getAll());
    mine=await Promise.all((all||[]).sort((a,b)=>b.ts-a.ts).map(async r=>({...r,url:await blobToUrl(r.blob)})))}
  catch(e){memOnly=true}
  mineReady=true; if(cur>=0&&!$("ee").classList.contains("show"))go(cur);
}
async function putMine(rec){
  const item={id:rec.id,page:rec.page,blob:rec.blob,ts:rec.ts,url:await blobToUrl(rec.blob)};
  if(!memOnly){try{await tx("readwrite",s=>s.put({id:item.id,page:item.page,blob:item.blob,ts:item.ts}))}catch(e){memOnly=true}}
  if(memOnly&&!memWarned){memWarned=true;toast(xt("mem"))}
  mine=mine.filter(m=>m.id!==rec.id); mine.push(item); mine.sort((a,b)=>b.ts-a.ts); return item}
async function delMine(id){const m=mine.find(x=>x.id===id);if(!m)return;
  if(!memOnly){try{await tx("readwrite",s=>s.delete(id))}catch(e){}}
  mine=mine.filter(x=>x.id!==id)}
const newId=()=>"m"+Date.now()+Math.random().toString(36).slice(2,6);

function afterShow(){const m=mine.find(x=>x.url===list[idx]);$("del").style.display=m?"":"none"}
function i18nExtra(){
  $("ed").textContent="✎ "+xt("edit"); $("del").textContent="🗑 "+xt("del");
  $("et").textContent=xt("edit"); $("es").textContent=xt("save"); $("ex").setAttribute("aria-label",xt("cancel"));

/* ---- إضافة صور ---- */
let addTarget=0;
async function fileToBlob(file){
  const url=await blobToUrl(file), im=await loadImg(url), mx=1600, s=Math.min(1,mx/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d"),png=/png|webp|gif/.test(file.type);
  if(!png){x.fillStyle="#fff";x.fillRect(0,0,w,h)} x.drawImage(im,0,0,w,h);
  return await new Promise((r,j)=>c.toBlob(b=>b?r(b):j(new Error("blob")),png?"image/png":"image/jpeg",0.88));
}
$("fi").onchange=async e=>{
  const files=[...e.target.files].slice(0,20); e.target.value=""; const pi=addTarget; let n=0;
  for(const f of files){ if(f.type&&!f.type.startsWith("image/"))continue;
    try{const blob=await fileToBlob(f);await putMine({id:newId(),page:pi,blob,ts:Date.now()+n});n++}catch(err){console.error(err);toast(xt("err"))} }
  if(n){toast(n>1?xt("added_n").replace("{n}",n):xt("added")); if(cur===pi)go(pi)}
};
$("del").onclick=async()=>{
  const m=mine.find(x=>x.url===list[idx]); if(!m)return;
  const ok=await ask(xt("confirm_del"),[{t:xt("del"),v:true,c:"dng"},{t:xt("cancel"),v:null,c:"o"}]); if(!ok)return;

};
$("ed").onclick=()=>startEdit(list[idx]);

/* ---- المحرر ---- */
const FILTER_OK=(()=>{try{return "filter" in document.createElement("canvas").getContext("2d")}catch(e){return false}})();
const FILTERS={orig:"",bw:"grayscale(1) contrast(1.1)",sepia:"sepia(.85)",vivid:"saturate(1.5) contrast(1.1)",
  warm:"sepia(.25) saturate(1.3) hue-rotate(-10deg) brightness(1.05)",cool:"saturate(1.1) hue-rotate(15deg) brightness(1.02)",
  fade:"contrast(.85) brightness(1.1) saturate(.8)",drama:"contrast(1.4) brightness(.9) saturate(1.2)"};
const E={on:false,img:null,base:null,page:0,mineId:null,png:false,rot:0,flip:false,crop:{x:0,y:0,w:1,h:1},ratio:0,
  filter:"orig",b:100,c:100,s:100,texts:[],sel:-1,tab:"filters",cw:0,ch:0,tcolor:"#ffffff",tsize:8};
const filterStr=()=>((FILTERS[E.filter]||"")+" brightness("+E.b+"%) contrast("+E.c+"%) saturate("+E.s+"%)").trim();

function buildBase(){
  const im=E.img,sw=im.naturalWidth||800,sh=im.naturalHeight||800,s=Math.min(1,1600/Math.max(sw,sh));
  const w=Math.round(sw*s),h=Math.round(sh*s),r=E.rot%180!==0;
  const c=document.createElement("canvas");c.width=r?h:w;c.height=r?w:h;
  const x=c.getContext("2d");x.translate(c.width/2,c.height/2); if(E.flip)x.scale(-1,1); x.rotate(E.rot*Math.PI/180);
  x.drawImage(im,-w/2,-h/2,w,h); E.base=c;
}
function drawText(ctx,t,cw,ch,sel){
  const fs=t.size/100*ch; ctx.save();
  ctx.font="700 "+fs+"px Cairo,system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.direction=/[\u0590-\u08ff]/.test(t.txt)?"rtl":"ltr";
  ctx.fillStyle=t.color;ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=fs*.12;ctx.fillText(t.txt,t.x*cw,t.y*ch);
  if(sel){const w=ctx.measureText(t.txt).width;ctx.shadowColor="transparent";ctx.strokeStyle="#8D36FF";ctx.lineWidth=2;ctx.setLineDash([8,6]);
    ctx.strokeRect(t.x*cw-w/2-8,t.y*ch-fs*.75,w+16,fs*1.5)}
  ctx.restore();
}
function drawTo(ctx,cw,ch,full){
  const b=E.base,cr=E.crop;
  ctx.save();ctx.filter=filterStr()||"none";ctx.drawImage(b,cr.x*b.width,cr.y*b.height,cr.w*b.width,cr.h*b.height,0,0,cw,ch);ctx.restore();
  E.texts.forEach((t,i)=>drawText(ctx,t,cw,ch,!full&&i===E.sel));
}
function layout(){
  const st=$("est"),W=st.clientWidth-48,H=st.clientHeight-48;
  const iw=E.tab==="crop"?E.base.width:E.crop.w*E.base.width, ih=E.tab==="crop"?E.base.height:E.crop.h*E.base.height;
  const s=Math.min(W/iw,H/ih);E.cw=Math.max(40,Math.floor(iw*s));E.ch=Math.max(40,Math.floor(ih*s));
}
function placeBox(){const cb=$("cb"),c=E.crop;cb.style.left=c.x*E.cw+"px";cb.style.top=c.y*E.ch+"px";cb.style.width=c.w*E.cw+"px";cb.style.height=c.h*E.ch+"px"}
function paint(){
  if(!E.on||!E.base)return; layout();
  const c=$("ec"),dpr=Math.min(2,window.devicePixelRatio||1),W=Math.round(E.cw*dpr),H=Math.round(E.ch*dpr);
  $("ew").style.width=E.cw+"px";$("ew").style.height=E.ch+"px";c.style.width=E.cw+"px";c.style.height=E.ch+"px";
  if(c.width!==W||c.height!==H){c.width=W;c.height=H}
  const ctx=c.getContext("2d");ctx.clearRect(0,0,W,H);
  if(E.tab==="crop"){ctx.save();ctx.filter=filterStr()||"none";ctx.drawImage(E.base,0,0,W,H);ctx.restore();$("cb").style.display="block";placeBox()}
  else{$("cb").style.display="none";drawTo(ctx,W,H,false)}
}
const TABS=[["crop","✂️","crop"],["rotate","🔄","rotate"],["filters","✨","filters"],["adjust","☀️","adjust"],["text","Aa","text"]]
  .filter(t=>FILTER_OK||!["filters","adjust"].includes(t[0]));
function buildTabs(){const b=$("etabs");b.innerHTML="";
  TABS.forEach(([id,ic,k])=>{const x=document.createElement("button");x.className=E.tab===id?"on":"";x.innerHTML="<span>"+ic+"</span><small>"+xt(k)+"</small>";x.onclick=()=>setTab(id);b.appendChild(x)})}
function setTab(id){E.tab=id;buildTabs();buildPanel();requestAnimationFrame(paint)}
function setRatio(r){E.ratio=r;
  if(r){const bw=E.base.width,bh=E.base.height;let wp=bw,hp=bw/r;if(hp>bh){hp=bh;wp=bh*r}
    E.crop={x:(1-wp/bw)/2,y:(1-hp/bh)/2,w:wp/bw,h:hp/bh}}
  placeBox();buildPanel()}
function rebase(){buildBase();E.crop={x:0,y:0,w:1,h:1};E.ratio=0;paint();if(E.tab==="crop")buildPanel()}

function buildPanel(){
  const p=$("ep");p.innerHTML="";const row=()=>{const d=document.createElement("div");d.className="row";p.appendChild(d);return d};
  const btn=(parent,cls,html,fn)=>{const b=document.createElement("button");b.className=cls;b.innerHTML=html;b.onclick=fn;parent.appendChild(b);return b};
  if(E.tab==="crop"){
    const r1=row();
    [["free",0],["1:1",1],["4:5",.8],["3:4",.75],["9:16",9/16],["16:9",16/9]].forEach(([n,v])=>
      btn(r1,"rb"+(Math.abs(E.ratio-v)<1e-6?" on":""),n==="free"?xt("free"):n,()=>setRatio(v)));
    const r2=row();
    btn(r2,"pill",xt("apply"),()=>setTab(FILTER_OK?"filters":"rotate"));
    btn(r2,"pill o",xt("reset"),()=>{E.crop={x:0,y:0,w:1,h:1};E.ratio=0;buildPanel();paint()});
  }else if(E.tab==="rotate"){
    const r=row();
    btn(r,"sq","⟲",()=>{E.rot=(E.rot+270)%360;rebase()}); btn(r,"sq","⟳",()=>{E.rot=(E.rot+90)%360;rebase()});
    btn(r,"sq","⇋",()=>{E.flip=!E.flip;rebase()}); btn(r,"pill o",xt("reset"),()=>{E.rot=0;E.flip=false;rebase()});
  }else if(E.tab==="filters"){
    const r=row();
    Object.keys(FILTERS).forEach(k=>{
      const b=document.createElement("button");b.className="fb"+(E.filter===k?" on":"");
      const c=document.createElement("canvas");c.width=c.height=72;const x=c.getContext("2d");x.filter=FILTERS[k]||"none";
      const bs=E.base,s=Math.max(72/bs.width,72/bs.height),w=bs.width*s,h=bs.height*s;x.drawImage(bs,(72-w)/2,(72-h)/2,w,h);
      b.appendChild(c);const l=document.createElement("span");l.textContent=xt("f_"+k);b.appendChild(l);
      b.onclick=()=>{E.filter=k;r.querySelectorAll(".fb").forEach(z=>z.classList.remove("on"));b.classList.add("on");paint()};r.appendChild(b)});
  }else if(E.tab==="adjust"){
    [["b","brightness",50,150],["c","contrast",50,150],["s","saturation",0,200]].forEach(([k,lab,mn,mx])=>{
      const d=document.createElement("div");d.className="sl";
      d.innerHTML="<label>"+xt(lab)+'</label><input type="range" min="'+mn+'" max="'+mx+'" value="'+E[k]+'"><output>'+E[k]+"</output>";
      const inp=d.querySelector("input"),out=d.querySelector("output");
      inp.oninput=()=>{E[k]=+inp.value;out.textContent=inp.value;paint()};p.appendChild(d)});
  }else if(E.tab==="text"){
    const r1=row();r1.style.overflow="visible";
    const ti=document.createElement("input");ti.id="ti";ti.type="text";ti.placeholder=xt("t_ph");ti.setAttribute("dir","auto");r1.appendChild(ti);
    btn(r1,"pill",xt("t_add"),()=>{const v=ti.value.trim()||xt("t_def");E.texts.push({txt:v,x:.5,y:.5,size:E.tsize,color:E.tcolor});E.sel=E.texts.length-1;ti.value=v;paint()});
    ti.oninput=()=>{if(E.sel>=0&&ti.value.trim()){E.texts[E.sel].txt=ti.value;paint()}};
    const r2=row();r2.style.flexWrap="wrap";r2.style.overflow="visible";
    ["#ffffff","#000000","#ffd60a","#ff453a","#8D36FF","#30d158"].forEach(c=>{
      const b=btn(r2,"sw"+(E.tcolor===c?" on":""),"",()=>{E.tcolor=c;if(E.sel>=0)E.texts[E.sel].color=c;r2.querySelectorAll(".sw").forEach(z=>z.classList.remove("on"));b.classList.add("on");paint()});
      b.style.background=c});
    const tz=document.createElement("input");tz.type="range";tz.min=3;tz.max=25;tz.value=E.tsize;tz.style.flex="1";tz.style.minWidth="90px";tz.setAttribute("aria-label",xt("t_size"));
    tz.oninput=()=>{E.tsize=+tz.value;if(E.sel>=0)E.texts[E.sel].size=E.tsize;paint()};r2.appendChild(tz);
    btn(r2,"pill o",xt("t_del"),()=>{if(E.sel>=0){E.texts.splice(E.sel,1);E.sel=-1;ti.value="";paint()}});
    const h=document.createElement("div");h.className="hint";h.textContent=xt("t_hint");p.appendChild(h);
  }
}

/* قص: سحب المربع والزوايا */
function cropDrag(kind,e){
  e.preventDefault();e.stopPropagation();
  const st={...E.crop},sx=e.clientX,sy=e.clientY,bw=E.base.width,bh=E.base.height,mn=.08;
  const move=ev=>{
    const dx=(ev.clientX-sx)/E.cw,dy=(ev.clientY-sy)/E.ch;let {x,y,w,h}=st;
    if(kind==="move"){x=clamp(st.x+dx,0,1-w);y=clamp(st.y+dy,0,1-h)}
    else{let l=st.x,t=st.y,r=st.x+st.w,b=st.y+st.h;
      if(kind.includes("l"))l=clamp(st.x+dx,0,r-mn); if(kind.includes("r"))r=clamp(st.x+st.w+dx,l+mn,1);
      if(kind.includes("t"))t=clamp(st.y+dy,0,b-mn); if(kind.includes("b"))b=clamp(st.y+st.h+dy,t+mn,1);
      x=l;y=t;w=r-l;h=b-t;
      if(E.ratio){let nh=w*bw/(E.ratio*bh);
        if(kind.includes("t")){if(b-nh<0){nh=b;w=nh*E.ratio*bh/bw}y=b-nh}else{if(t+nh>1){nh=1-t;w=nh*E.ratio*bh/bw}y=t}
        if(kind.includes("l"))x=r-w; h=nh}}
    E.crop={x,y,w,h};placeBox()};
  const up=()=>{removeEventListener("pointermove",move);removeEventListener("pointerup",up);removeEventListener("pointercancel",up)};
  addEventListener("pointermove",move);addEventListener("pointerup",up);addEventListener("pointercancel",up);
}
$("cb").addEventListener("pointerdown",e=>cropDrag(e.target.dataset&&e.target.dataset.k?e.target.dataset.k:"move",e));

/* نص: اختيار وسحب */
const mctx=document.createElement("canvas").getContext("2d");
function inText(t,px,py){const fs=t.size/100*E.ch;mctx.font="700 "+fs+"px Cairo,system-ui,sans-serif";
  const w=mctx.measureText(t.txt).width;return Math.abs(px-t.x*E.cw)<=w/2+14&&Math.abs(py-t.y*E.ch)<=fs*.85}
$("ec").addEventListener("pointerdown",e=>{
  if(E.tab!=="text")return;
  const r=$("ec").getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let hit=-1;
  for(let i=E.texts.length-1;i>=0;i--){if(inText(E.texts[i],px,py)){hit=i;break}}
  E.sel=hit;
  const ti=$("ti");if(ti){ti.value=hit>=0?E.texts[hit].txt:""}
  paint(); if(hit<0)return; e.preventDefault();
  const t=E.texts[hit],ox=t.x,oy=t.y,sx=e.clientX,sy=e.clientY;
  const mv=ev=>{t.x=clamp(ox+(ev.clientX-sx)/E.cw,.02,.98);t.y=clamp(oy+(ev.clientY-sy)/E.ch,.02,.98);paint()};
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up)};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
});

async function startEdit(src){
  let im;try{im=await loadImg(src)}catch(e){toast(xt("err"));return}
  const rec=mine.find(m=>m.url===src);
  Object.assign(E,{on:true,img:im,page:cur,mineId:rec?rec.id:null,rot:0,flip:false,crop:{x:0,y:0,w:1,h:1},ratio:0,
    filter:"orig",b:100,c:100,s:100,texts:[],sel:-1,tab:FILTER_OK?"filters":"crop",
    png:/\.(png|webp|gif)(\?|#|$)/i.test(src)||!!(rec&&/png|webp|gif/.test(rec.blob.type))});
  buildBase();$("ee").classList.add("show");setTab(E.tab);
}
function closeEditor(){E.on=false;E.img=null;E.base=null;$("ee").classList.remove("show")}
$("ex").onclick=closeEditor;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&E.on&&!$("dlg").classList.contains("show"))closeEditor()});
addEventListener("resize",()=>{if(E.on)paint()});

function exportBlob(){
  const b=E.base,cw=Math.max(1,Math.round(E.crop.w*b.width)),ch=Math.max(1,Math.round(E.crop.h*b.height));
  const c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d");
  if(!E.png){x.fillStyle="#fff";x.fillRect(0,0,cw,ch)} drawTo(x,cw,ch,true);
  return new Promise((res,rej)=>c.toBlob(bl=>bl?res(bl):rej(new Error("blob")),E.png?"image/png":"image/jpeg",0.92));
}
$("es").onclick=async()=>{
  const opts=[{t:xt("save_copy"),v:"copy"}]; if(E.mineId)opts.push({t:xt("replace"),v:"rep",c:"o"});
  opts.push({t:xt("download"),v:"dl",c:"o"},{t:xt("cancel"),v:null,c:"o"});
  const v=await ask(xt("save_q"),opts); if(!v)return;
  let blob;try{blob=await exportBlob()}catch(e){toast(xt("err"));return}
  if(v==="dl"){dlBlob(blob,"photo-"+Date.now()+(E.png?".png":".jpg"));toast(xt("dl_started"));return}
  const orig=mine.find(m=>m.id===E.mineId);
  if(v==="rep"&&orig){await putMine({id:orig.id,page:orig.page,blob,ts:orig.ts});toast(xt("replaced"))}
  else{await putMine({id:newId(),page:E.page,blob,ts:Date.now()});toast(xt("saved_here"))}
  closeEditor();$("lb").classList.remove("show");go(cur);
};
